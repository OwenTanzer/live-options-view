name = "live-options-view"
main = "worker.js"
compatibility_date = "2026-06-23"
account_id = "413bc8abe4485cf2a2e0d9f534436ade"

[assets]
directory = "docs"
binding = "ASSETS"

[[r2_buckets]]
binding = "PAPER_TRADES"
bucket_name = "qqq-options-chain-data"

# Backs /api/register, /api/login, /api/logout, /api/me, /api/bots, and the
# session-authenticated /api/paper-trade and /api/settle. These ids are not
# secrets -- a namespace id only resolves against this account -- but they must
# be real: wrangler rejects the deploy outright on an unknown id, which is how
# the PR #15 auth build silently failed to ship for a week (run 29759921735).
[[kv_namespaces]]
binding = "USERS"
id = "e6d7e57f32ea4122ba81b8c84dc28553"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2b996344769e4e679d9f307196a76b84"

# Server-side settlement sweep (see the `scheduled` export in worker.js /
# settleAllBots) -- fixes bot accounts that never settle because nothing
# opens their dashboard to fire the client-triggered /api/settle call
# (issue #42). Runs every 15 minutes from 12:00-23:45 UTC on trading days.
# The early window clears anything left from the prior session before the US
# market opens; the late window covers the 16:15 ET same-day cutoff on both
# sides of the EST/EDT boundary. Settlement is idempotent, so repeated runs are
# cheap no-ops once a day's positions are settled.
[triggers]
crons = ["*/15 12-23 * * 1-5"]
