name = "live-options-view"
main = "worker.js"
compatibility_date = "2026-06-23"
account_id = "413bc8abe4485cf2a2e0d9f534436ade"

[assets]
directory = "docs"
binding = "ASSETS"

[[r2_buckets]]
binding = "PAPER_TRADES"
bucket_name = "qqq-options-chain-data"

# Backs /api/register, /api/login, /api/logout, /api/me, /api/bots, and the
# session-authenticated /api/paper-trade and /api/settle. These ids are not
# secrets -- a namespace id only resolves against this account -- but they must
# be real: wrangler rejects the deploy outright on an unknown id, which is how
# the PR #15 auth build silently failed to ship for a week (run 29759921735).
[[kv_namespaces]]
binding = "USERS"
id = "e6d7e57f32ea4122ba81b8c84dc28553"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2b996344769e4e679d9f307196a76b84"

# Crassus AI's kill switch + per-bot freeze flags (worker.js
# handleCrassusKillSwitch/handleCrassusFreezeGet/Post) and its versioned
# override channel + decision-ledger durability mirror (handleCrassusOverride*,
# handleCrassusLedgerMirror; schema in migrations/0001_crassus_ai.sql). See
# crassus/crassus/policy.py for why this exists: the previously-proposed
# "shared JSON file" between Railway services can't be durable or safely
# shared, so this is the real store both the Worker (browser-facing) and the
# Railway-hosted Crassus runner (via these Worker routes) read and write
# against.
#
# NOT YET PROVISIONED -- commented out on purpose, not left as placeholder
# ids. Flagged in review: master auto-deploys this Worker on every merge, and
# wrangler refuses to deploy against an unknown KV/D1 id (same reason the
# USERS/SESSIONS ids above must be real) -- a literal placeholder here would
# have broken every deploy, including ones touching nothing Crassus-AI-related,
# the moment this PR landed. Every other route (auth, trading, settlement,
# live quotes) does not need either binding and is completely unaffected by
# them being absent; worker.js's checkCrassusStorage() guard makes the
# Crassus AI routes themselves return a clean 503 rather than throwing, which
# crassus/overrides_client.py already treats as "fail closed, no override."
#
# To actually turn this on:
#   wrangler kv:namespace create CRASSUS_CONTROL
#   wrangler d1 create crassus_ai
#   wrangler d1 execute crassus_ai --file=migrations/0001_crassus_ai.sql
# then uncomment both blocks below with the real ids each command prints, and
# set CRASSUS_AI_ENABLED=true for the Railway runner (see
# crassus/crassus/config.py) -- it defaults to false/off (no network calls at
# all) independent of whether these bindings exist.
#
# [[kv_namespaces]]
# binding = "CRASSUS_CONTROL"
# id = "REPLACE_WITH_REAL_CRASSUS_CONTROL_KV_ID"
#
# [[d1_databases]]
# binding = "CRASSUS_DB"
# database_name = "crassus_ai"
# database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Server-side settlement sweep (see the `scheduled` export in worker.js /
# settleAllBots) -- fixes bot accounts that never settle because nothing
# opens their dashboard to fire the client-triggered /api/settle call
# (issue #42). Runs every 15 minutes from 12:00-23:45 UTC on trading days.
# The early window clears anything left from the prior session before the US
# market opens; the late window covers the 16:15 ET same-day cutoff on both
# sides of the EST/EDT boundary. Settlement is idempotent, so repeated runs are
# cheap no-ops once a day's positions are settled.
[triggers]
crons = ["*/15 12-23 * * 1-5"]
