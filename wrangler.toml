name = "live-options-view"
main = "worker.js"
compatibility_date = "2026-06-23"
account_id = "413bc8abe4485cf2a2e0d9f534436ade"

[assets]
directory = "docs"
binding = "ASSETS"

[[r2_buckets]]
binding = "PAPER_TRADES"
bucket_name = "qqq-options-chain-data"

# Run `wrangler kv namespace create USERS` and `wrangler kv namespace create
# SESSIONS`, then replace the placeholder ids below with the ones printed by
# those commands. Required for /api/register, /api/login, /api/logout,
# /api/me, and the session-authenticated /api/paper-trade and /api/settle.
[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_WITH_USERS_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_KV_NAMESPACE_ID"
