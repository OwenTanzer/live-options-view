name: Crypto offline acceptance
on:
  pull_request:
    paths: ["site/**", "market_mcp/**", "market_data/crypto_collector/**", "tests/**", ".github/workflows/crypto-ci.yml"]
  push:
    branches: [master]
    paths: ["site/**", "market_mcp/**", "market_data/crypto_collector/**", "tests/**", ".github/workflows/crypto-ci.yml"]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_crypto_collector.py -v
      - run: node --test tests/crypto_panel.test.js tests/crypto_predictions_panel.test.mjs tests/boot.test.js tests/tab_switching.test.js
      - run: node --test market_mcp/crypto_snapshot.test.js market_mcp/consumer.test.js
      - run: node tests/news_panel_view.test.js
