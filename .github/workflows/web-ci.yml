name: Web CI

# The Worker and front end had no PR gate: crassus-ci.yml is path-filtered to
# crassus/**, so a change to worker.js or site/ showed a green tick that had
# tested none of it -- while merging to master fires deploy.yml straight into
# production. This runs the JS suites on any PR that touches those paths.
on:
  pull_request:
    paths:
      - "backend/**"
      - "site/**"
      - "tests/**"
      - "wrangler.toml"
      - "scripts/stamp-build.mjs"
      - "scripts/generate-quote-instruments.mjs"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "site/**"
      - "tests/**"
      - "wrangler.toml"
      - "scripts/stamp-build.mjs"
      - "scripts/generate-quote-instruments.mjs"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/web-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify build packaging before merge
        run: node --test tests/build_stamp.test.mjs
      - name: public browser data allowlist
        run: node tests/browser_data.test.js
      - name: historical archive loading
        run: node tests/historical_archive.test.js
      - name: worker logic
        run: node tests/worker_logic.test.js
      - name: D1 account/session storage (#208)
        env:
          # node:sqlite is behind this flag on Node 22 (unflagged on 24).
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/storage_d1.test.mjs
      - name: KV to D1 migration and rollback (#208)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/migrate_d1.test.mjs
      - name: KV page cache (#208)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/kv_page_cache.test.mjs
      - name: Auth logout regression (#208)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/auth_logout.test.mjs
      - name: Verify stays within the CPU budget (#208)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/verify_bounded.test.mjs
      - name: No runtime KV bindings (#208)
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tests/no_runtime_kv.test.mjs
      - name: bot registration probe contract
        run: node tests/preflight_worker_contract.test.js
      - name: capture-prefix R2 write boundary (G4a)
        run: node tests/capture_write_boundary.test.js
      - name: bot account closure and identity compatibility
        run: node tests/account_closure.test.js
      - name: automated tab panel
        run: node tests/bots_panel.test.js
      - name: live quote service
        run: node tests/live_quote_service.test.js
      - name: adaptive quote instruments projection
        run: node tests/quote_instruments.test.js
      - name: adaptive quote cards model
        run: node tests/quote_panel.test.js
      - name: adaptive quote cards DOM and refresh controller
        run: node tests/quote_panel_dom.test.js
      - name: order logic
        run: node tests/order_logic.test.js
      - name: vwap/rvol display
        run: node tests/vwap_rvol_display.test.js
      - name: momentum display
        run: node tests/momentum_display.test.js
      - name: chain underlying (QQQ/SPY)
        run: node tests/chain_underlying.test.js
      - name: eia steo calibration display
        run: node tests/steo_calibration_display.test.js
      - name: optional eia steo panel fetch
        run: node tests/steo_panel.test.js
      - name: squeeze scanner panel display
        run: node tests/squeeze_scanner_display.test.js
      - name: squeeze scanner panel
        run: node tests/squeeze_panel.test.js
      - name: paper trading workflow
        run: node tests/paper_trading.test.js
      - name: multi-underlying chain and settlement (#182)
        run: node tests/multi_underlying.test.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Historical rendered browser workflow
        run: node tests/historical_browser.test.js
      # Catches syntax errors in the inline <script> that the panel test would
      # otherwise only surface for the section it extracts. B2 extracts
      # sections into site/js/ one at a time; each extracted module gets the
      # same parse gate here so a broken module cannot ship.
      - name: parse check
        run: |
          node -e "
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            if (fs.existsSync('backend')) {
              for (const file of fs.readdirSync('backend', { recursive: true }).filter(f => f.endsWith('.js'))) {
                console.log('Checking backend/' + file);
                execFileSync(process.execPath, ['--check', '--input-type=module'], {
                  input: fs.readFileSync('backend/' + file), stdio: ['pipe', 'inherit', 'inherit']
                });
              }
            }
          "
          node --check site/shared.js
          for f in site/shared/*.js; do node --check "$f"; done
          for f in site/js/*.js; do node --check "$f"; done
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('site/index.html', 'utf8');
            const blocks = [...html.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error('no inline script found in site/index.html');
            for (const [i, b] of blocks.entries()) {
              try { new Function(b[1]); } catch (e) { throw new Error('inline block ' + i + ': ' + e.message); }
            }
            console.log('parsed ' + blocks.length + ' inline block(s)');
          "
