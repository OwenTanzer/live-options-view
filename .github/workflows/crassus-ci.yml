name: Crassus invariant suite

on:
  push:
    branches: [master]
    paths:
      - "crassus/**"
      - ".github/workflows/crassus-ci.yml"
  pull_request:
    paths:
      - "crassus/**"
      - ".github/workflows/crassus-ci.yml"

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: crassus
        run: pip install -r requirements.txt
      - name: Run integrity invariant suite
        working-directory: crassus
        run: python scripts/verify_invariants.py
      - name: Run reddit_sentiment_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_reddit_sentiment.py
      - name: Run reddit_sentiment_qqq ingestion suite
        working-directory: crassus
        run: python scripts/verify_reddit_ingestion.py
      - name: Run trump_whisperer_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_trump_whisperer.py
      - name: Run trump_whisperer_qqq ingestion suite
        working-directory: crassus
        run: python scripts/verify_trump_ingestion.py
      - name: Run momentum_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_momentum_qqq.py
      - name: Run VWAP/RVOL data contract and gate suite
        working-directory: crassus
        run: python scripts/verify_vwap_rvol.py
      - name: Run mandatory EOD flatten suite
        working-directory: crassus
        run: python scripts/verify_flatten.py
      - name: Run NYSE exchange calendar suite
        working-directory: crassus
        run: python scripts/verify_exchange_calendar.py
      - name: Run runner/flatten attribution and crash-recovery suite
        working-directory: crassus
        run: python scripts/verify_runner_flatten_attribution.py
      - name: Run canopus_down_day_14 strategy suite
        working-directory: crassus
        run: python scripts/verify_canopus_down_day.py

  docker-build-smoke:
    # Builds the exact image Railway deploys from (see crassus/railway.toml's
    # `builder = "DOCKERFILE"`) and fails if it can't. This is not redundant
    # with verify-invariants above: that job installs crassus/requirements.txt
    # into whatever Python runner GitHub Actions provides, which proves the
    # hermetic test suites pass but says nothing about whether the deployed
    # image can actually launch Chromium -- crassus/Dockerfile's own
    # `RUN python scripts/smoke_browser_launch.py` build step is what proves
    # that, and this job is what runs it on every PR instead of relying on a
    # one-off manual `docker build` before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build crassus Docker image (fails if Chromium can't launch inside it)
        working-directory: crassus
        run: docker build -t crassus-ci-smoke .
