name: Crassus invariant suite

on:
  push:
    branches: [master]
    paths:
      - "crassus/**"
      - "tests/oi_skew_meter_parity.py"
      - "tests/fixtures/oi_skew_parity.json"
      - "market_data/overview/readings.py"
      - ".github/workflows/crassus-ci.yml"
  pull_request:
    paths:
      - "crassus/**"
      - "tests/oi_skew_meter_parity.py"
      - "tests/fixtures/oi_skew_parity.json"
      - "market_data/overview/readings.py"
      - ".github/workflows/crassus-ci.yml"

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: crassus
        run: pip install -r requirements.txt
      - name: Run integrity invariant suite
        working-directory: crassus
        run: python scripts/verify_invariants.py
      - name: Run strategy-state lifecycle and per-account tracker suite
        working-directory: crassus
        run: python scripts/verify_strategy_state.py
      - name: Run OI-skew per-account tracker suite (#107)
        working-directory: crassus
        run: python scripts/verify_oi_skew_accounts.py
      # The site OI skew meter (site/shared/oi-skew.js) is pinned to the real
      # bot gates and collector reading by this fixture; a strategy or reading
      # change that alters any case fails here until the fixture (and, if the
      # semantics moved, the meter) is updated. Web CI checks the JS side.
      - name: OI skew meter parity fixture is current
        run: python tests/oi_skew_meter_parity.py
      - name: OI skew decision provenance for the meter projection
        working-directory: crassus
        run: python scripts/verify_oi_skew_provenance.py
      - name: OI skew meter projection (inactive): provenance, privacy, unavailability
        working-directory: crassus
        run: python scripts/verify_oi_skew_projection.py
      - name: Run immutable market-readings join suite (#107)
        working-directory: crassus
        run: python scripts/verify_market_readings_join.py
      - name: Run reddit_sentiment_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_reddit_sentiment.py
      - name: Run reddit_sentiment_qqq ingestion suite
        working-directory: crassus
        run: python scripts/verify_reddit_ingestion.py
      - name: Run Reddit failure-window and bounded acquisition regressions
        working-directory: crassus
        run: python scripts/verify_reddit_failure_window.py
      - name: Run trump_whisperer_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_trump_whisperer.py
      - name: Run trump_whisperer_qqq ingestion suite
        working-directory: crassus
        run: python scripts/verify_trump_ingestion.py
      - name: Run momentum_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_momentum_qqq.py
      - name: Run momentum_puts_only_qqq strategy suite
        working-directory: crassus
        run: python scripts/verify_momentum_puts_only.py
      - name: Run VWAP/RVOL data contract and gate suite
        working-directory: crassus
        run: python scripts/verify_vwap_rvol.py
      - name: Run Black-Scholes tool and shared buy-diagnostic suite
        working-directory: crassus
        run: python scripts/verify_black_scholes.py
      - name: Run canopus_down_day_14 strategy suite
        working-directory: crassus
        run: python scripts/verify_canopus_down_day.py
      - name: Run Guideline Phelps suite
        working-directory: crassus
        run: python scripts/verify_phelps.py
      - name: Run changing-ATM position-stacking fixture (#86)
        working-directory: crassus
        run: python scripts/verify_position_stacking.py
      - name: Run configurable profit/protective exit suite (#86)
        working-directory: crassus
        run: python scripts/verify_exits.py
      - name: Run bot credential preflight suite (#41)
        working-directory: crassus
        run: python scripts/verify_preflight.py
      - name: Run supervisor heartbeat protocol suite (#41)
        working-directory: crassus
        run: python scripts/verify_heartbeat_protocol.py
      - name: Run login classification and session recovery suite (#41)
        working-directory: crassus
        run: python scripts/verify_session_recovery.py
      - name: Run bounded registration-key health suite (#41)
        working-directory: crassus
        run: python scripts/verify_key_health.py
      - name: Run pre-merge credential provisioning gate suite (#41)
        working-directory: crassus
        run: python scripts/verify_provisioning_gate.py
      - name: Run isolated paper lifecycle with real Runner + Worker harness (#41/#86/#102)
        working-directory: crassus
        run: python scripts/verify_paper_lifecycle.py
      - name: Run looking_glass_straddle strategy suite
        working-directory: crassus
        run: python scripts/verify_looking_glass_straddle.py
      - name: Run looking_glass_straddle Runner-integration suite (300s cadence)
        working-directory: crassus
        run: python scripts/verify_looking_glass_straddle_runner_integration.py
      - name: Run mandatory EOD flatten suite
        working-directory: crassus
        run: python scripts/verify_flatten.py
      - name: Run NYSE exchange calendar suite
        working-directory: crassus
        run: python scripts/verify_exchange_calendar.py
      - name: Run runner/flatten attribution and crash-recovery suite
        working-directory: crassus
        run: python scripts/verify_runner_flatten_attribution.py
      - name: Run snapshot lineage and recovery suite
        working-directory: crassus
        run: python scripts/verify_snapshot_lineage.py
      - name: Run operational logging and cycle-completion suite
        working-directory: crassus
        run: python scripts/verify_observability.py
      - name: Run runner reliability failure-injection suite
        working-directory: crassus
        run: python scripts/verify_reliability.py
      - name: Run durable archive failure-boundary suite
        working-directory: crassus
        run: python scripts/verify_archive.py

  provisioning-gate:
    # Review-time control for #41: an entry that becomes active with a
    # credential variable for the first time must carry redacted provisioning
    # evidence, or land as active:false. Fetch depth is full so the pull
    # request's base revision is available to compare against; the script
    # fails closed when it cannot resolve it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate runtime dependencies
        working-directory: crassus
        run: pip install -r requirements.txt
      - name: Gate newly active bot credentials
        working-directory: crassus
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ]; then
            BASE_REF=none
          fi
          python scripts/provisioning_gate.py --base-ref "$BASE_REF" --json

  docker-build-smoke:
    # Builds the exact image Railway deploys from (see crassus/railway.toml's
    # `builder = "DOCKERFILE"`) and fails if it can't. This is not redundant
    # with verify-invariants above: that job installs crassus/requirements.txt
    # into whatever Python runner GitHub Actions provides, which proves the
    # hermetic test suites pass but says nothing about whether the deployed
    # image can actually launch Chromium -- crassus/Dockerfile's own
    # `RUN python scripts/smoke_browser_launch.py` build step is what proves
    # that, and this job is what runs it on every PR instead of relying on a
    # one-off manual `docker build` before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build crassus Docker image (fails if Chromium can't launch inside it)
        working-directory: crassus
        run: docker build -t crassus-ci-smoke .
      - name: Run real Chromium memory and fatal-driver regression
        timeout-minutes: 10
        run: docker run --name crassus-reliability-soak --network none --entrypoint python crassus-ci-smoke scripts/soak_reliability.py --cycles 30 --output /tmp/reliability-soak.json
      - name: Verify real Chromium Reddit acquisition deadline and cleanup
        timeout-minutes: 2
        run: docker run --rm --network none --entrypoint python crassus-ci-smoke scripts/verify_reddit_acquisition_browser.py
      - name: Extract measured soak evidence
        if: always()
        run: docker cp crassus-reliability-soak:/tmp/reliability-soak.json reliability-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crassus-reliability-soak
          path: reliability-soak.json
          if-no-files-found: warn
