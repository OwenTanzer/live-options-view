name: Collector suite

# Root collector code and the read-only provider probes share dependencies and
# safety invariants. Keep every executable probe and its regression tests on
# the same required workflow.
on:
  push:
    branches: [master]
    paths:
      - "market_data/**"
      - "deployment/python/**"
      - "tests/producer_packaging.py"
      - "tests/test_market_overview.py"
      - "tests/test_price_observations.py"
      - "tests/test_price_lane.py"
      - "tests/test_snapshot_provenance.py"
      - "tests/test_market_readings.py"
      - "tests/test_market_readings_series.py"
      - "research/market_readings_series.py"
      - "research/historical_archive_parity.py"
      - "research/archive_qualification.py"
      - "research/archive_sample_fetch.py"
      - "tests/test_probe_cross_market_symbols.py"
      - "market_data/live_market/probe_oauth.py"
      - "market_data/tradier/probe.py"
      - "market_data/tradier/__main__.py"
      - "market_data/diagnostics.py"
      - "tests/test_capture_diagnostics.py"
      - "market_data/options_scanner/__main__.py"
      - "tests/test_auth_safety.py"
      - "tests/test_moo144_tradier_probe.py"
      - "tests/test_moo144_tradier_collector.py"
      - "tests/test_oa203_return_scanner.py"
      - "tests/test_oa203_active.py"
      - "tests/test_oa203_active_budget.py"
      - "market_data/options_scanner/active_budget.py"
      - "market_data/options_scanner/active_readiness.py"
      - "market_data/options_scanner/windows.py"
      - "market_data/options_scanner/windows_replay.py"
      - "tests/test_oa203_windows.py"
      - "market_data/options_scanner/windows_outputs.py"
      - "tests/test_oa203_windows_outputs.py"
      - "tests/test_oa203_windows_replay.py"
      - "tests/stage2_verification.py"
      - "tests/verify_collector_vwap_rvol.py"
      - "tests/verify_collector_spy.py"
      - "tests/test_multi_underlying.py"
      - "tests/verify_crude_calibration.py"
      - "tests/verify_eia_steo_calibration.py"
      - "tests/verify_weekly_collection.py"
      - "tests/verify_manifest_concurrency.py"
      - ".github/workflows/collector-ci.yml"
  pull_request:
    paths:
      - "market_data/**"
      - "deployment/python/**"
      - "tests/producer_packaging.py"
      - "tests/test_market_overview.py"
      - "tests/test_price_observations.py"
      - "tests/test_price_lane.py"
      - "tests/test_snapshot_provenance.py"
      - "tests/test_market_readings.py"
      - "tests/test_market_readings_series.py"
      - "research/market_readings_series.py"
      - "research/historical_archive_parity.py"
      - "research/archive_qualification.py"
      - "research/archive_sample_fetch.py"
      - "tests/test_probe_cross_market_symbols.py"
      - "market_data/live_market/probe_oauth.py"
      - "market_data/tradier/probe.py"
      - "market_data/tradier/__main__.py"
      - "market_data/diagnostics.py"
      - "tests/test_capture_diagnostics.py"
      - "market_data/options_scanner/__main__.py"
      - "tests/test_auth_safety.py"
      - "tests/test_moo144_tradier_probe.py"
      - "tests/test_moo144_tradier_collector.py"
      - "tests/test_oa203_return_scanner.py"
      - "tests/test_oa203_active.py"
      - "tests/test_oa203_active_budget.py"
      - "market_data/options_scanner/active_budget.py"
      - "market_data/options_scanner/active_readiness.py"
      - "market_data/options_scanner/windows.py"
      - "market_data/options_scanner/windows_replay.py"
      - "tests/test_oa203_windows.py"
      - "market_data/options_scanner/windows_outputs.py"
      - "tests/test_oa203_windows_outputs.py"
      - "tests/test_oa203_windows_replay.py"
      - "tests/stage2_verification.py"
      - "tests/verify_collector_vwap_rvol.py"
      - "tests/verify_collector_spy.py"
      - "tests/test_multi_underlying.py"
      - "tests/verify_crude_calibration.py"
      - "tests/verify_eia_steo_calibration.py"
      - "tests/verify_weekly_collection.py"
      - "tests/verify_manifest_concurrency.py"
      - ".github/workflows/collector-ci.yml"

jobs:
  verify-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r deployment/python/requirements.txt
      - name: Run collector unit suite
        run: python tests/stage2_verification.py
      - name: Run OAuth and auth-circuit safety suite
        run: python -m unittest discover -s tests -p test_auth_safety.py -v
      - name: Run MOO-144 Tradier probe suite
        run: python -m unittest discover -s tests -p test_moo144_tradier_probe.py -v
      - name: Run MOO-169 Tradier collector suite
        run: python -m unittest discover -s tests -p test_moo144_tradier_collector.py -v
      - name: Run OA-203 options return scanner suite
        run: python -m unittest discover -s tests -p test_oa203_return_scanner.py -v
      - name: Run OA-203 active snapshot suite
        run: python -m unittest discover -s tests -p 'test_oa203_active*.py' -v
      - name: Run cross-market overview suite (#132)
        run: python -m unittest discover -s tests -p test_market_overview.py -v
      - name: Run price observation provenance suite (#132)
        run: python -m unittest discover -s tests -p test_price_observations.py -v
      - name: Run extended price lane suite (#178)
        run: python -m unittest discover -s tests -p test_price_lane.py -v
      - name: Run snapshot price provenance suite (#146)
        run: python -m unittest discover -s tests -p test_snapshot_provenance.py -v
      - name: Run reference market-readings suite (#107)
        run: python -m unittest discover -s tests -p test_market_readings.py -v
      - name: Run market-readings replay series suite (#107)
        run: python -m unittest discover -s tests -p test_market_readings_series.py -v
      - name: Run full overview activation suite (#132)
        run: python -m unittest discover -s tests -p test_overview_activation.py -v
      - name: Run cross-market symbol probe safety suite (#132)
        run: python -m unittest discover -s tests -p test_probe_cross_market_symbols.py -v
      - name: Run OA-203 multi-session window suite (#130)
        run: python -m unittest discover -s tests -p "test_oa203_windows*.py" -v
      - name: Run capture diagnostics suite
        run: python -m unittest discover -s tests -p test_capture_diagnostics.py -v
      - name: Run VWAP/RVOL collector suite
        run: python tests/verify_collector_vwap_rvol.py
      - name: Run SPY collection isolation suite
        run: python tests/verify_collector_spy.py
      - name: Run multi-underlying settlement marks suite (#182)
        run: python -m unittest discover -s tests -p test_multi_underlying.py -v
      - name: Run crude calibration suite
        run: python tests/verify_crude_calibration.py
      - name: Run EIA STEO calibration suite
        run: python tests/verify_eia_steo_calibration.py
      - name: Run weekly collection suite
        run: python tests/verify_weekly_collection.py
      - name: Run manifest merge protocol suite (#225 R2b)
        run: python tests/verify_manifest_concurrency.py
      - name: Verify actual producer image entry points (offline)
        run: |
          docker build -f deployment/python/Dockerfile -t producer-check .
          docker run --rm --network none \
            -v "$PWD/tests/producer_packaging.py:/app/tests/producer_packaging.py:ro" \
            producer-check python tests/producer_packaging.py
