name: Nasdaq offline acceptance
on:
  pull_request:
    paths: ["site/**", "market_mcp/**", "market_data/nasdaq_collector/**", "tests/**", ".github/workflows/nasdaq-ci.yml"]
  push:
    branches: [master]
    paths: ["site/**", "market_mcp/**", "market_data/nasdaq_collector/**", "tests/**", ".github/workflows/nasdaq-ci.yml"]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pytest
      - run: python -m pytest tests/test_nasdaq_collector.py -q
      - run: node --test tests/nasdaq_panel.test.js tests/boot.test.js tests/tab_switching.test.js
      - run: node --test market_mcp/nasdaq_snapshot.test.js market_mcp/consumer.test.js
      - run: node tests/news_panel_view.test.js
