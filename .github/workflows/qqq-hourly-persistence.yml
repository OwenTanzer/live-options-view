name: Temporary QQQ hourly persistence analysis

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze QQQ hourly and late-session persistence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics as st
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          urls = [
              "https://query2.finance.yahoo.com/v8/finance/chart/QQQ?range=60d&interval=5m&includePrePost=false&events=div%2Csplits",
              "https://query1.finance.yahoo.com/v8/finance/chart/QQQ?range=60d&interval=5m&includePrePost=false&events=div%2Csplits",
          ]
          payload = None
          for attempt in range(4):
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.load(response)["chart"]["result"][0]
                      break
                  except Exception:
                      pass
              if payload is not None:
                  break
              time.sleep(3 * (attempt + 1))
          if payload is None:
              raise RuntimeError("Unable to fetch QQQ bars")

          quote = payload["indicators"]["quote"][0]
          eastern = ZoneInfo("America/New_York")
          by_day = {}
          for i, timestamp in enumerate(payload["timestamp"]):
              dt = datetime.fromtimestamp(timestamp, eastern)
              o, c = quote["open"][i], quote["close"][i]
              if o is not None and c is not None:
                  by_day.setdefault(dt.date(), {})[dt.strftime("%H:%M")] = (float(o), float(c))

          open_checkpoints = [
              "09:30", "10:30", "11:30", "12:30", "13:30", "14:30",
              "15:00", "15:15", "15:30", "15:45", "15:50"
          ]
          required = open_checkpoints + ["15:55"]
          rows = []
          for date, bars in sorted(by_day.items()):
              if not all(t in bars for t in required):
                  continue
              prices = {t: bars[t][0] for t in open_checkpoints}
              prices["CLOSE"] = bars["15:55"][1]
              p0 = prices["09:30"]
              rows.append({
                  "date": str(date),
                  "open": p0,
                  "m": {t: abs(p - p0) for t, p in prices.items()},
              })

          def mean(x): return st.mean(x)
          def median(x): return st.median(x)
          def helped(x): return 100 * sum(v > 0 for v in x) / len(x)
          def line(tag, values): print(tag + "," + ",".join(str(v) for v in values))

          line("SAMPLE", [rows[0]["date"], rows[-1]["date"], len(rows)])

          intervals = [
              ("09:30", "10:30"), ("10:30", "11:30"), ("11:30", "12:30"),
              ("12:30", "13:30"), ("13:30", "14:30"), ("14:30", "15:30"),
              ("15:30", "CLOSE"),
          ]
          line("HOUR_HEADER", ["window", "mean", "median", "helped_pct"])
          for a, b in intervals:
              values = [r["m"][b] - r["m"][a] for r in rows]
              line("HOUR", [f"{a}-{b}", f"{mean(values):.6f}", f"{median(values):.6f}", f"{helped(values):.2f}"])

          late = ["15:00", "15:15", "15:30", "15:45", "15:50", "CLOSE"]
          line("LATE_CHECKPOINT_HEADER", ["time", "mean_abs", "median_abs", "mean_vs_1500", "median_vs_1500", "beats_1500_pct"])
          base = [r["m"]["15:00"] for r in rows]
          for t in late:
              values = [r["m"][t] for r in rows]
              delta = [r["m"][t] - r["m"]["15:00"] for r in rows]
              line("LATE_CHECKPOINT", [t, f"{mean(values):.6f}", f"{median(values):.6f}", f"{mean(delta):.6f}", f"{median(delta):.6f}", f"{helped(delta):.2f}"])

          adjacent = [("15:00", "15:15"), ("15:15", "15:30"), ("15:30", "15:45"), ("15:45", "15:50"), ("15:50", "CLOSE")]
          line("LATE_SLICE_HEADER", ["window", "mean", "median", "helped_pct"])
          for a, b in adjacent:
              values = [r["m"][b] - r["m"][a] for r in rows]
              line("LATE_SLICE", [f"{a}-{b}", f"{mean(values):.6f}", f"{median(values):.6f}", f"{helped(values):.2f}"])

          for threshold in [0.005, 0.0075, 0.0100, 0.0150]:
              subset = [r for r in rows if r["m"]["15:00"] / r["open"] >= threshold]
              line("COND_1500_HEADER", [f"threshold={threshold:.4f}", "n", "exit_time", "mean_vs_1500", "median_vs_1500", "beats_1500_pct"])
              for t in late[1:]:
                  delta = [r["m"][t] - r["m"]["15:00"] for r in subset]
                  line("COND_1500", [f"{threshold:.4f}", len(subset), t, f"{mean(delta):.6f}", f"{median(delta):.6f}", f"{helped(delta):.2f}"])

          # Fixed-time exit comparison: which checkpoint maximizes mean and median displacement?
          all_times = ["10:30", "11:30", "12:30", "13:30", "14:30", "15:00", "15:15", "15:30", "15:45", "15:50", "CLOSE"]
          means = {t: mean([r["m"][t] for r in rows]) for t in all_times}
          medians = {t: median([r["m"][t] for r in rows]) for t in all_times}
          line("BEST_FIXED_MEAN", [max(means, key=means.get), f"{max(means.values()):.6f}"])
          line("BEST_FIXED_MEDIAN", [max(medians, key=medians.get), f"{max(medians.values()):.6f}"])
          PY
