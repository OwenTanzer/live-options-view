name: Temporary QQQ final 15 minute detail

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze QQQ 15:45 to close day by day
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics as st
          import time
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          urls = [
              "https://query2.finance.yahoo.com/v8/finance/chart/QQQ?range=60d&interval=5m&includePrePost=false&events=div%2Csplits",
              "https://query1.finance.yahoo.com/v8/finance/chart/QQQ?range=60d&interval=5m&includePrePost=false&events=div%2Csplits",
          ]
          payload = None
          for attempt in range(5):
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.load(response)["chart"]["result"][0]
                      break
                  except Exception:
                      pass
              if payload is not None:
                  break
              time.sleep(3 * (attempt + 1))
          if payload is None:
              raise RuntimeError("Unable to fetch QQQ bars")

          quote = payload["indicators"]["quote"][0]
          eastern = ZoneInfo("America/New_York")
          by_day = {}
          for i, timestamp in enumerate(payload["timestamp"]):
              dt = datetime.fromtimestamp(timestamp, eastern)
              o, h, l, c = (quote[k][i] for k in ("open", "high", "low", "close"))
              if all(v is not None for v in (o, h, l, c)):
                  by_day.setdefault(dt.date(), {})[dt.strftime("%H:%M")] = {
                      "o": float(o), "h": float(h), "l": float(l), "c": float(c)
                  }

          required = ["09:30", "15:45", "15:50", "15:55"]
          rows = []
          for date, bars in sorted(by_day.items()):
              if not all(t in bars for t in required):
                  continue
              p0 = bars["09:30"]["o"]
              p45 = bars["15:45"]["o"]
              p50 = bars["15:50"]["o"]
              p55 = bars["15:55"]["o"]
              pc = bars["15:55"]["c"]
              d45 = p45 - p0
              dc = pc - p0
              sign45 = 1 if d45 > 0 else -1 if d45 < 0 else 0
              continuation = sign45 * (pc - p45) if sign45 else 0.0
              delta_abs = abs(dc) - abs(d45)
              cross = d45 * dc < 0
              if cross:
                  cls = "CROSS"
              elif delta_abs > 0.10:
                  cls = "EXTEND"
              elif delta_abs < -0.10:
                  cls = "RETRACE"
              else:
                  cls = "FLAT"
              rows.append({
                  "date": str(date), "weekday": date.strftime("%a"),
                  "open": p0, "p45": p45, "p50": p50, "p55": p55, "close": pc,
                  "d45": d45, "dc": dc, "abs45": abs(d45), "absc": abs(dc),
                  "last15": pc - p45, "continuation": continuation,
                  "delta_abs": delta_abs, "cross": cross, "class": cls,
                  "s1": sign45 * (p50 - p45) if sign45 else 0.0,
                  "s2": sign45 * (p55 - p50) if sign45 else 0.0,
                  "s3": sign45 * (pc - p55) if sign45 else 0.0,
              })

          def mean(xs): return st.mean(xs) if xs else float('nan')
          def median(xs): return st.median(xs) if xs else float('nan')
          def pct(n, d): return 100*n/d if d else float('nan')
          def line(tag, vals): print(tag + "," + ",".join(str(v) for v in vals))

          line("SAMPLE", [rows[0]["date"], rows[-1]["date"], len(rows)])
          line("SUMMARY_HEADER", ["n", "extend", "retrace", "flat", "cross", "mean_delta_abs", "median_delta_abs", "mean_last15", "median_last15", "mean_abs_last15"])
          counts = {c: sum(r["class"] == c for r in rows) for c in ["EXTEND", "RETRACE", "FLAT", "CROSS"]}
          line("SUMMARY", [len(rows), counts["EXTEND"], counts["RETRACE"], counts["FLAT"], counts["CROSS"],
                           f'{mean([r["delta_abs"] for r in rows]):.6f}', f'{median([r["delta_abs"] for r in rows]):.6f}',
                           f'{mean([r["last15"] for r in rows]):.6f}', f'{median([r["last15"] for r in rows]):.6f}',
                           f'{mean([abs(r["last15"]) for r in rows]):.6f}'])

          line("SLICE_HEADER", ["slice", "mean_continuation", "median_continuation", "continued_pct"])
          for key, label in [("s1", "15:45-15:50"), ("s2", "15:50-15:55"), ("s3", "15:55-close")]:
              xs = [r[key] for r in rows]
              line("SLICE", [label, f"{mean(xs):.6f}", f"{median(xs):.6f}", f"{pct(sum(x>0 for x in xs),len(xs)):.2f}"])

          line("DIRECTION_HEADER", ["direction_at_1545", "n", "mean_delta_abs", "median_delta_abs", "extend_pct", "retrace_pct", "cross_pct"])
          for label, sub in [("UP", [r for r in rows if r["d45"]>0]), ("DOWN", [r for r in rows if r["d45"]<0])]:
              line("DIRECTION", [label, len(sub), f'{mean([r["delta_abs"] for r in sub]):.6f}', f'{median([r["delta_abs"] for r in sub]):.6f}',
                                 f'{pct(sum(r["class"]=="EXTEND" for r in sub),len(sub)):.2f}', f'{pct(sum(r["class"]=="RETRACE" for r in sub),len(sub)):.2f}',
                                 f'{pct(sum(r["class"]=="CROSS" for r in sub),len(sub)):.2f}'])

          line("THRESH_HEADER", ["abs_move_at_1545", "n", "mean_delta_abs", "median_delta_abs", "extend_pct", "retrace_pct", "cross_pct"])
          for th in [0.0025, 0.0050, 0.0075, 0.0100, 0.0150]:
              sub = [r for r in rows if r["abs45"] / r["open"] >= th]
              line("THRESH", [f"{th:.4f}", len(sub), f'{mean([r["delta_abs"] for r in sub]):.6f}', f'{median([r["delta_abs"] for r in sub]):.6f}',
                              f'{pct(sum(r["class"]=="EXTEND" for r in sub),len(sub)):.2f}', f'{pct(sum(r["class"]=="RETRACE" for r in sub),len(sub)):.2f}',
                              f'{pct(sum(r["class"]=="CROSS" for r in sub),len(sub)):.2f}'])

          line("WEEKDAY_HEADER", ["weekday", "n", "mean_delta_abs", "median_delta_abs", "extend_pct", "retrace_pct"])
          for wd in ["Mon", "Tue", "Wed", "Thu", "Fri"]:
              sub = [r for r in rows if r["weekday"] == wd]
              line("WEEKDAY", [wd, len(sub), f'{mean([r["delta_abs"] for r in sub]):.6f}', f'{median([r["delta_abs"] for r in sub]):.6f}',
                               f'{pct(sum(r["class"]=="EXTEND" for r in sub),len(sub)):.2f}', f'{pct(sum(r["class"]=="RETRACE" for r in sub),len(sub)):.2f}'])

          line("DAY_HEADER", ["date", "weekday", "open", "p1545", "close", "move_at_1545", "last15_move", "delta_abs", "class", "slice1_cont", "slice2_cont", "slice3_cont"])
          for r in rows:
              line("DAY", [r["date"], r["weekday"], f'{r["open"]:.2f}', f'{r["p45"]:.2f}', f'{r["close"]:.2f}',
                           f'{r["d45"]:.2f}', f'{r["last15"]:.2f}', f'{r["delta_abs"]:.2f}', r["class"],
                           f'{r["s1"]:.2f}', f'{r["s2"]:.2f}', f'{r["s3"]:.2f}'])

          for label, ordered in [("BEST", sorted(rows, key=lambda r:r["delta_abs"], reverse=True)[:10]),
                                 ("WORST", sorted(rows, key=lambda r:r["delta_abs"])[:10])]:
              line(label+"_HEADER", ["rank", "date", "delta_abs", "move_at_1545", "last15_move", "class"])
              for i,r in enumerate(ordered,1):
                  line(label, [i, r["date"], f'{r["delta_abs"]:.2f}', f'{r["d45"]:.2f}', f'{r["last15"]:.2f}', r["class"]])
          PY
