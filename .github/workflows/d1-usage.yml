name: D1 daily account budget
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check account-wide rows since midnight UTC
        env:
          CLOUDFLARE_ACCOUNT_ID: 413bc8abe4485cf2a2e0d9f534436ade
          CLOUDFLARE_API_TOKEN: ${{ secrets.D1_ANALYTICS_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/d1-usage.mjs
